<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Semantic Blog Rewrite</title>
</head>
<body>
  <!-- Header with Semantic Site Title and Accessible Navigation -->
  <header>
    <h1>My Blog</h1>
    <nav aria-label="Blog Navigation">
      <a href="/">Home</a>
    </nav>
  </header>

  <!-- Main Article Post Landmark -->
  <main>
    <article class="post">
      <header>
        <h2>First Post</h2>
        <time datetime="2026-08-09">August 9, 2026</time>
      </header>
      <p>Hello world</p>
    </article>
  </main>
</body>
</html>
