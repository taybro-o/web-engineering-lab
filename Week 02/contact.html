<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Dedicated contact page for Muhammad Tayyab" />
  <title>Contact - Muhammad Tayyab</title>
</head>
<body>
  <header>
    <h1>Get in Touch</h1>
    <nav aria-label="Main Navigation">
      <ul>
        <li><a href="profile.html">Profile &amp; About</a></li>
        <li><a href="profile.html#skills">Skills</a></li>
        <li><a href="contact.html">Contact Page</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h2>Send a Message</h2>
      <form action="#" method="post">
        <div>
          <label for="contactName">Name *</label>
          <input type="text" id="contactName" name="name" required />
        </div>
        <div>
          <label for="contactEmail">Email *</label>
          <input type="email" id="contactEmail" name="email" required />
        </div>
        <div>
          <label for="contactMessage">Message *</label>
          <textarea id="contactMessage" name="message" rows="5" required></textarea>
        </div>
        <button type="submit">Send Inquiry</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Muhammad Tayyab (CMS ID: 023-24-0118). All rights reserved. | Built with Semantic HTML5.</p>
  </footer>
</body>
</html>
