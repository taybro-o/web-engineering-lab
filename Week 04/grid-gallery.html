<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Grid Gallery: Class Activity C</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      padding: 1.5rem;
      max-width: 1100px;
      margin: 0 auto;
    }
    h1 { font-size: 1.5rem; }
    p.subtitle { color: #555; font-size: 0.95rem; margin-bottom: 1.5rem; }

    /* Activity C: Grid gallery with auto-fit + minmax (zero media queries) */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1rem;
    }
    .photo {
      background: #ddd;
      padding: 2.5rem 1rem;
      text-align: center;
      font-size: 1.25rem;
      font-weight: bold;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>
  <h1>Grid Gallery (Activity C)</h1>
  <p class="subtitle">Muhammad Tayyab (CMS ID: 023-24-0118) &bull; Responsive with <code>auto-fit</code> and <code>minmax(250px, 1fr)</code> (No media queries required).</p>

  <section class="gallery">
    <div class="photo">1</div>
    <div class="photo">2</div>
    <div class="photo">3</div>
    <div class="photo">4</div>
    <div class="photo">5</div>
    <div class="photo">6</div>
  </section>
</body>
</html>
